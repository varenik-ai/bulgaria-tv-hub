name: Check streams

on:
  schedule:
    - cron: '20 */3 * * *'   # каждые 3 часа
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check every channel (playlist and one segment)
        run: python3 scripts/check_streams.py
      - name: Keep the detailed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status
          path: status.json
          retention-days: 7
