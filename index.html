// ── Safe area ──────────────────────────────────────────────────────────────
function updateSafeArea() {
  const tgTop = tg?.contentSafeAreaInsets?.top || tg?.safeAreaInsets?.top || 0;
  const top = tgTop > 0 ? tgTop : (document.fullscreenElement || tg?.isFullscreen ? 32 : 0);
  document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
}
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes(); } catch(e) {}
  try { tg.setHeaderColor('#000000'); } catch(e) {}
  try { tg.setBackgroundColor('#000000'); } catch(e) {}
  if (isAndroid() || isIOS()) setTimeout(() => { try { tg.requestFullscreen(); } catch(e) {} }, 300);
  try { tg.onEvent('safeAreaChanged', updateSafeArea); } catch(e) {}
  try { tg.onEvent('contentSafeAreaChanged', updateSafeArea); } catch(e) {}
  setTimeout(updateSafeArea, 500);
}

  return /iPad|iPhone|iPod/.test(navigator.userAgent)

let _soundWanted = false;
function _restoreSound() {
  if (!_soundWanted || !currentCh) return;
  try {
    video.muted = false; video.volume = 1; userUnmuted = true;
    unmuteBtn.textContent = '🔇 ' + t.mute;
    const ab = document.getElementById('audio-bg'); if (ab) { ab.muted = true; ab.pause(); }
    setTimeout(() => {
      if (!currentCh || !video.paused) return;
      // браузер не дал включить звук без жеста — возвращаем безопасный режим без звука
      video.muted = true; userUnmuted = false; unmuteBtn.textContent = '🔊 ' + t.unmute;
      video.play().catch(() => {});
    }, 1500);
  } catch (e) {}
}
video.addEventListener('playing', () => { _playedOnce = true; _failStreak = 0; });
video.addEventListener('timeupdate', () => {
  if (video.currentTime !== _lastVideoTime) { _lastVideoTime = video.currentTime; _lastProgressTime = Date.now(); }
});
function _tryNudgeGap() {
  try {
    if (video.buffered && video.buffered.length) {
      const end = video.buffered.end(video.buffered.length - 1);
      if (end - video.currentTime > 0.5) {
        video.currentTime = Math.max(end - 0.25, video.currentTime + 0.1);
        return true;
      }
    }
  } catch (e) {}
  return false;
}
function _watchdogReconnect(statusKey) {
  if (_watchdogReconnecting || !currentCh || _gaveUp) return;
  if (!_playedOnce) { _failStreak++; if (_failStreak > MAX_FAIL_STREAK) { _giveUp(); return; } }
  _watchdogReconnecting = true;
  _lastProgressTime = Date.now();
  setStatus(statusKey, true);
  stopStream();
  init().finally(() => { _watchdogReconnecting = false; });
}
setInterval(() => {
  if (window.__castActive) return;
  if (!currentCh || video.seeking || _watchdogReconnecting || _gaveUp) return;
  if (video.readyState >= 3 && typeof video.getVideoPlaybackQuality === 'function') {
    const _vpq = video.getVideoPlaybackQuality();
    if (_vpq.totalVideoFrames > _lastFrameCount) {
      _lastFrameCount = _vpq.totalVideoFrames;
      _lastFrameProgressTime = Date.now();
    } else if (!video.paused && Date.now() - _lastFrameProgressTime > 9000) {
      // currentTime может тикать (аудио/системные часы), пока сам видеокадр не
      // обновляется — картинка визуально замирает/чернеет при формально "живом"
      // потоке. Проверка по currentTime одна это не ловит.
      _lastFrameProgressTime = Date.now();
      _watchdogReconnect('errorStream');
      return;
    }
  }
  if (video.paused && video.readyState < 3) {
    // В мини-аппе нет пользовательской паузы во время просмотра (кроме userPaused,
    // который здесь исключаем) — остановка без буфера означает зависание/сбой.
    if (userPaused) return;
    if (Date.now() - _lastProgressTime > (_playedOnce ? 12000 : START_GRACE_MS)) {
      if (_tryNudgeGap()) { _lastProgressTime = Date.now(); return; }
      _watchdogReconnect('errorStream');
    }
    return;
  }
  if (Date.now() - _lastProgressTime > (_playedOnce ? 18000 : START_GRACE_MS)) {
    if (_tryNudgeGap()) { _lastProgressTime = Date.now(); return; }
    _watchdogReconnect('errorStream');
  }
}, 5000);

async function init() {
  if (!currentCh) return;
  setStatus('loading'); reloadBtn.style.display='none'; unmuteBtn.style.display='none';
  try {
    // Прямая ссылка на CDN (источник отдаёт CORS). После 2 неудач подряд — запасной путь через воркер.
    const viaProxy = _failStreak >= 2 ? '&proxy=1' : '';
    const r = await fetch(currentCh.stream + '&t=' + Date.now() + viaProxy, { cache:'no-store' });
    const d = await r.json();
    if (d.url) loadStream(d.url); else { setStatus('errorUrl', true); _scheduleInit(2000); }
  } catch(e) { setStatus('errorServer', true); _scheduleInit(2000); }
}

// ── Кнопки ─────────────────────────────────────────────────────────────────
reloadBtn.onclick = () => { userPaused=false; _resetRetry(); init(); };
unmuteBtn.onclick = () => {
  const ab = document.getElementById('audio-bg');
  if (video.muted) {
    video.muted=false; video.volume=1; userUnmuted=true; _soundWanted=true;
    unmuteBtn.textContent = '🔇 '+t.mute;
    if (ab) { ab.muted=true; ab.pause(); }
  } else {
    video.muted=true; userUnmuted=false; _soundWanted=false;
    unmuteBtn.textContent = '🔊 '+t.unmute;
    if (ab && isIOS()) { ab.muted=false; ab.volume=0; ab.play().catch(()=>{}); }
  }
};
modeBtn.onclick = () => setAudioMode(!audioOnly);

// ── Хаб ───────────────────────────────────────────────────────────────────
function buildHub() {
  channelsGrid.innerHTML = '';
  CHANNEL_GROUPS.forEach(group => {
    const header = document.createElement('div');
    header.className = 'category-header';
    header.textContent = group.label;
    channelsGrid.appendChild(header);
    group.channels.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.style.setProperty('--ch-color', ch.color);
      card.innerHTML = `
        <div class="ch-icon${ch.logo ? ' ch-logo' : ''}" style="background:${ch.iconBg};color:${ch.color}">${ch.logo ? `<img src="${ch.logo}" alt="${ch.icon}" loading="lazy">` : ch.icon}</div>
        <div class="ch-info"><div class="ch-name">${ch.name}</div><div class="ch-desc">${ch.desc || 'На живо'}</div></div>
        <div class="live-dot"></div>`;
      const im = card.querySelector('.ch-logo img');
      if (im) im.onerror = () => { const b = im.parentElement; b.classList.remove('ch-logo'); b.textContent = ch.icon; };
      card.onclick = () => openChannel(ch);
      channelsGrid.appendChild(card);
    });
  });
}

function openChannel(ch) {
  gaEvent('channel_open', { channel_id: ch.id, channel_name: ch.name });
  currentCh = ch;
  hubScreen.style.display = 'none';
  playerScreen.style.display = 'flex';
  chTitle.textContent = ch.name;
  liveBadgeTop.style.background = ch.color;
  liveBadge.style.background = ch.color.replace(')', ', .9)').replace('rgb', 'rgba');
  audioOnly = false; document.body.classList.remove('audio-only');
  modeBtn.textContent = t.audioMode;
  _soundWanted=false; _resetRetry(); _playedOnce=false;
  stopStream(); init();
}

function goToHub() {
  stopStream();
  playerScreen.style.display = 'none';
  hubScreen.style.display = 'flex';
  currentCh = null;
}

// Кнопка назад — в хаб (много каналов, не закрываем приложение)
backBtn.onclick = () => goToHub();

// ── Благодарность через Telegram Stars (⭐) ──────────────────────────────
const BOT_API = 'https://bulgaria-bot-worker.dyaltd.workers.dev';
const donateModal = document.getElementById('donate-modal');
function openDonate() {
  gaEvent('donate_open', {});
  document.getElementById('donate-title').textContent = t.thank;
  const box = document.getElementById('donate-amounts'); box.innerHTML = '';
  [25, 50, 100, 250].forEach(n => {
    const b = document.createElement('button'); b.textContent = '⭐ ' + n;
    b.onclick = () => payStars(n); box.appendChild(b);
  });
  donateModal.style.display = 'flex';
}
async function payStars(amount) {
  try {
    const r = await fetch(BOT_API + '/invoice?amount=' + amount);
    const d = await r.json();
    if (!d.url || !tg?.openInvoice) return;
    donateModal.style.display = 'none';
    tg.openInvoice(d.url, status => { if (status === 'paid') gaEvent('donate_paid', { stars: amount }); });
  } catch (e) {}
}
document.getElementById('privacy-link').onclick = e => {
  if (!IN_TG) return;
  e.preventDefault();
  try { tg.openLink(new URL('privacy.html', location.href).href, { try_instant_view: false }); } catch (err) { location.href = 'privacy.html'; }
};
document.getElementById('donate-close').onclick = () => { donateModal.style.display = 'none'; };
donateModal.addEventListener('click', e => { if (e.target === donateModal) donateModal.style.display = 'none'; });
['thank-btn-hub', 'thank-btn-player'].forEach(id => {
  const el = document.getElementById(id); el.textContent = t.thank; el.onclick = openDonate;
});

buildHub();

// Deep-link: #id или ?startapp=id (t.me/<bot>/<app>?startapp=btv) открывает канал сразу
(function () {
  // В Telegram location.hash непустой (#tgWebAppData=...), поэтому параметр запуска берём отдельно
  const hp = new URLSearchParams((location.hash || '').replace('#', ''));
  const hashId = (location.hash || '').indexOf('=') < 0 ? (location.hash || '').replace('#', '') : '';
  const raw = tg?.initDataUnsafe?.start_param || hp.get('tgWebAppStartParam') || hashId || '';
  if (!raw) return;
  const all = CHANNEL_GROUPS.reduce((a, g) => a.concat(g.channels), []);
  const ch = all.find(c => c.id === raw);
  if (ch) openChannel(ch);
  else if (raw === 'donate') openDonate();
})();
</script>
